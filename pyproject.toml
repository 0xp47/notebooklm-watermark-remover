[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-watermark-remover"
version = "1.0.0"
description = "Watermark remover for PDF, PPTX, and image documents generated by NotebookLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NotebookLM Watermark Remover Contributors" }
]
dependencies = [
    "pymupdf>=1.20.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "python-pptx>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
